 # ----------------------------------------------------------------------------
 # DES-Y3 LENS VALUES FROM TABLE IV, PAGE 34 of 2105.13549
 # ----------------------------------------------------------------------------
 # Lensing photo-z errors
  DES_DZ_L1:
    prior:
      dist: norm
      loc: 0.006
