      ns: 0.96605
      H0: 67.32
      omegab: 0.04
      omegam: 0.3
      mnu: 0.06
      w0pwa: -0.9
      w: -0.9
      DES_DZ_S1: 0.0414632
      DES_DZ_S2: 0.00147332
      DES_DZ_S3: 0.0237035
      DES_DZ_S4: -0.0773436
      DES_M1: 0.0191832
      DES_M2: -0.0431752
      DES_M3: -0.034961
      DES_M4: -0.0158096
      DES_A1_1: 0.606102
      DES_A1_2: -1.51541
      DES_A2_1: 0.01
      DES_A2_2: -1.5448080290038528
      DES_BTA_1: 0.8154011496506723

