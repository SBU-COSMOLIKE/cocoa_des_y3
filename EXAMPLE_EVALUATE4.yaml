    prior:
      min: 0.5
      max: 5
    ref:
      dist: norm
      loc: 2.1
      scale: 0.65
    proposal: 0.4
    latex: 10^9 A_\mathrm{s}
    drop: true
    renames: A
  ns:
    prior:
      min: 0.87
      max: 1.07
    ref:
      dist: norm
      loc: 0.96605
      scale: 0.01
    proposal: 0.01
    latex: n_\mathrm{s}
  H0:
    prior:
      min: 55
      max: 91
    ref:
      dist: norm
      loc: 67.32
      scale: 5
    proposal: 3
    latex: H_0
  omegab:
    prior:
      min: 0.03
      max: 0.07
    ref:
      dist: norm
      loc: 0.0495
      scale: 0.004
    proposal: 0.004
    latex: \Omega_\mathrm{b}
    drop: true
  omegam:
    prior:
      min: 0.1
      max: 0.9
    ref:
      dist: norm
      loc: 0.316
      scale: 0.02
    proposal: 0.02
    latex: \Omega_\mathrm{m}
    drop: true
  mnu:
    prior:
      min: 0.06
      max: 0.6
    ref:
      dist: norm
      loc: 0.25
      scale: 0.1
    proposal: 0.05
  w0pwa:
    prior:
      min: -5 
      max: -0.01
    ref:
      dist: norm
      loc: -0.99
      scale: 0.05
    proposal: 0.05
    latex: w_{0,\mathrm{DE}}+w_{a,\mathrm{DE}}
    drop: true
  w:
    prior:
      min: -3
      max: -0.01
    ref:
      dist: norm
      loc: -0.99
      scale: 0.05
    proposal: 0.05
    latex: w_{0,\mathrm{DE}}
  tau:
    value: 0.0697186
    latex: \tau_\mathrm{reio}
  # ----------------------------------------------------------------------------
  # DES-Y1 3x2pt nuissance parameter begins
  # ----------------------------------------------------------------------------
  DES_DZ_S1:
    prior:
      dist: norm
      loc: -0.001
      scale: 0.016
    ref:
      dist: norm
      loc: -0.001
      scale: 0.016
    proposal: 0.005
    latex: \Delta z_\mathrm{s,DES}^1
  DES_DZ_S2:
    prior:
      dist: norm
      loc: -0.019
      scale: 0.013
    ref:
      dist: norm
      loc: -0.019
      scale: 0.013
    proposal: 0.005
    latex: \Delta z_\mathrm{s,DES}^2
  DES_DZ_S3:
    prior:
      dist: norm
      loc: 0.009
      scale: 0.011
    ref:
      dist: norm
      loc: 0.009
      scale: 0.011
    proposal: 0.005
    latex: \Delta z_\mathrm{s,DES}^3
  DES_DZ_S4:
    prior:
      dist: norm
      loc: -0.018
      scale: 0.022
    ref:
      dist: norm
      loc: -0.018
      scale: 0.022
    proposal: 0.005
    latex: \Delta z_\mathrm{s,DES}^4
  DES_M1:
    prior:
      dist: norm
      loc: 0.012
      scale: 0.023
    ref:
      dist: norm
      loc: 0.012
      scale: 0.023
    proposal: 0.005
    latex: m_\mathrm{DES}^1
  DES_M2:
    prior:
      dist: norm
      loc: 0.012
      scale: 0.023
    ref:
      dist: norm
      loc: 0.012
      scale: 0.023
    proposal: 0.005
    latex: m_\mathrm{DES}^2
  DES_M3:
    prior:
      dist: norm
      loc: 0.012
      scale: 0.023
    ref:
      dist: norm
      loc: 0.012
      scale: 0.023
    proposal: 0.005
    latex: m_\mathrm{DES}^3
  DES_M4:
    prior:
      dist: norm
      loc: 0.012
      scale: 0.023
    ref:
      dist: norm
      loc: 0.012
      scale: 0.023
    proposal: 0.005
    latex: m_\mathrm{DES}^4
  DES_A1_1:
    prior:
      min: -5
      max:  5
    ref:
      dist: norm
      loc: 0.7
      scale: 0.5
    proposal: 0.5
    latex: A_\mathrm{1-IA,DES}^1
  DES_A1_2:
    prior:
      min: -5
      max:  5
    ref:
      dist: norm
      loc: -1.7
      scale: 0.5
    proposal: 0.5
    latex: A_\mathrm{1-IA,DES}^2
  DES_A2_1: #TATT, not used for Y1 (IA = NLA on cosmolike which does't even consider these params)
    value: 0.0
    latex: A_\mathrm{2-IA,DES}^1 
  DES_A2_2: #TATT, not used for Y1 (IA = NLA on cosmolike which does't even consider these params)
    value: 0.0
    latex: A_\mathrm{2-IA,DES}^2
  DES_BTA_1: #TATT, not used for Y1 (IA = NLA on cosmolike which does't even consider these params)
    value: 0.0
    latex: A_\mathrm{BTA-IA,DES}^1
 # Lensing photo-z errors
  DES_DZ_L1:
    prior:
      dist: norm
      loc: 0.008
      scale: 0.007
    ref:
      dist: norm
      loc: 0.008
      scale: 0.007
    proposal: 0.004
    latex: \Delta z_\mathrm{l,DES}^1
  DES_DZ_L2:
    prior:
      dist: norm
      loc: -0.005
      scale: 0.007
    ref:
      dist: norm
      loc: -0.005
      scale: 0.007
    proposal: 0.003
    latex: \Delta z_\mathrm{l,DES}^2
  DES_DZ_L3:
    prior:
      dist: norm
      loc: 0.006
      scale: 0.006
    ref:
      dist: norm
      loc: 0.006
      scale: 0.006
    proposal: 0.003
    latex: \Delta z_\mathrm{l,DES}^3
  DES_DZ_L4:
    prior:
      dist: norm
      loc: 0.0
      scale: 0.01
    ref:
      dist: norm
      loc: 0.0
      scale: 0.01
    proposal: 0.005
    latex: \Delta z_\mathrm{l,DES}^4
  DES_DZ_L5:
