timing: True
debug: True
stop_at_error: True

likelihood:
  des_y3.combo_3x2pt:
  #des_y3.combo_2x2pt:
  #des_y3.combo_xi_gg:
  #des_y3.combo_xi_ggl:
    path: ./external_modules/data/des_y3
    data_file: des_y1_real.dataset
    accuracyboost: 1.0
    integration_accuracy: 0
    lmax: 50000 # lmax computed for real space correlation function
    kmax_boltzmann: 5.0
    # 1 EE2, 2 Halofit
    non_linear_emul: 2
    # IA_MODEL: 0 = NLA, 1 = TATT
    IA_model: 0
    # IA_code: 0 = C FASTPT, 1 = Python PAST-PT
    IA_code: 0
    IA_redshift_evolution: 3
    use_baryon_pca: false
    create_baryon_pca: false
    baryon_pca_select_sims: "antilles-2-99/antilles-101-378/antilles-380-400"
    filename_baryon_pca: "./projects/lsst_y1/chains/pca.txt"
params:
